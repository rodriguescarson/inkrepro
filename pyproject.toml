[project]
name = "inkrepro"
version = "0.1.0"
description = "Measure how much an ink prediction depends on which checkpoint produced it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "tifffile>=2023.1.1"]

[project.scripts]
inkrepro = "inkrepro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["error::RuntimeWarning"]
